name: Verify

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: 🏗️ Build
        run: npm run build

  backend:
    name: Backend (sync + import)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: 📦 Sync Dependencies
        run: uv sync --frozen

      - name: 🔧 Install System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libpango-1.0-0 libpangocairo-1.0-0 ffmpeg

      - name: 🗂️ Create Media Directory
        run: mkdir -p media/videos/720p30

      - name: 🧩 Compile Python Files
        run: python -m compileall app

      - name: 🚀 Smoke Import
        run: python -c "from app.main import app"
